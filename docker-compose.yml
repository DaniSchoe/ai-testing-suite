# Lokale Entwicklungsumgebung: Postgres, Keycloak (mit Demo-Realm), Mock-Gateway, App und Worker.
# Wichtig: "127.0.0.1 keycloak" in /etc/hosts eintragen, damit Browser und App dieselbe Issuer-URL nutzen.
# Ohne Keycloak geht es auch: AUTH_MODE=dev setzen (Login als Dev-Admin).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suite
      POSTGRES_PASSWORD: suite
      POSTGRES_DB: suite
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'suite']
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm', '--http-port=8081']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak:8081
    ports: ['8081:8081']
    volumes: ['./deploy/keycloak/realm-ai-testing.json:/opt/keycloak/data/import/realm-ai-testing.json:ro']

  mock-llm:
    build: .
    command: ['node', 'tools/mock-llm.js']
    ports: ['4000:4000']

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
    environment: &appenv
      DATABASE_URL: postgres://suite:suite@postgres:5432/suite
      APP_SECRET: change-me-local-dev-secret-0123456789
      PUBLIC_URL: http://localhost:8080
      AUTH_MODE: oidc
      OIDC_ISSUER_URL: http://keycloak:8081/realms/ai-testing
      OIDC_CLIENT_ID: ai-testing-suite
      OIDC_CLIENT_SECRET: dev-client-secret
      OIDC_ALLOW_INSECURE: 'true'
      ADMIN_EMAILS: admin@example.com
      RUN_WORKER: 'false'
    ports: ['8080:8080']

  worker:
    build: .
    command: ['node', 'src/worker.js']
    depends_on:
      postgres: { condition: service_healthy }
    environment: *appenv

volumes:
  pgdata:
