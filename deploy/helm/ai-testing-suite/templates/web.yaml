apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suite.fullname" . }}-web
  labels: {{- include "suite.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "suite.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels: {{- include "suite.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "suite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "src/server.js"]
          env:
            {{- include "suite.env" . | nindent 12 }}
            - name: RUN_WORKER
              value: {{ .Values.worker.embedded | quote }}
            - name: MIGRATE_ON_START
              value: {{ (not .Values.migrations.enabled) | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          {{- if .Values.branding.existingConfigMap }}
          volumeMounts:
            - name: branding
              mountPath: /branding
              readOnly: true
          {{- end }}
      {{- if .Values.branding.existingConfigMap }}
      volumes:
        - name: branding
          configMap:
            name: {{ .Values.branding.existingConfigMap }}
            optional: true
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "suite.fullname" . }}
  labels: {{- include "suite.labels" . | nindent 4 }}
spec:
  selector: {{- include "suite.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
