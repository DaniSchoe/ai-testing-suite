{{- if not .Values.secrets.existingSecret }}
{{- $db := .Values.secrets.databaseUrl }}
{{- if and (not $db) .Values.postgresql.enabled }}
{{- $db = printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgresql.username .Values.postgresql.password (include "suite.fullname" .) .Values.postgresql.database }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suite.secretName" . }}
  labels: {{- include "suite.labels" . | nindent 4 }}
  annotations:
    # Muss vor dem Migrations-Hook existieren.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl oder postgresql.enabled setzen" $db | quote }}
  APP_SECRET: {{ required "secrets.appSecret ist erforderlich (mind. 32 Zeichen)" .Values.secrets.appSecret | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  OIDC_PERSONA_CLIENT_SECRET: {{ .Values.secrets.oidcPersonaClientSecret | quote }}
{{- end }}
