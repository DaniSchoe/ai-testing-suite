{{- if not .Values.secrets.existingSecret }}
{{- /* Bereits erzeugte Werte bei Upgrades wiederverwenden, sonst zufällig erzeugen. */}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace (include "suite.secretName" .)).data | default dict }}
{{- $appSecret := .Values.secrets.appSecret | default (get $old "APP_SECRET" | b64dec) | default (randAlphaNum 48) }}
{{- $pgPassword := .Values.postgresql.password | default (get $old "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 32) }}
{{- $db := .Values.secrets.databaseUrl }}
{{- if .Values.postgresql.enabled }}
{{- $db = printf "postgres://%s:%s@%s-postgres:5432/%s" (.Values.postgresql.username | urlquery) ($pgPassword | urlquery) (include "suite.fullname" .) .Values.postgresql.database }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suite.secretName" . }}
  labels: {{- include "suite.labels" . | nindent 4 }}
  annotations:
    # Muss vor dem Migrations-Hook existieren. Hook-Ressourcen bleiben bei helm uninstall
    # erhalten, damit passt das Passwort weiter zum behaltenen Postgres-Volume.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "Externe Datenbank: secrets.databaseUrl setzen (oder postgresql.enabled=true)" $db | quote }}
  APP_SECRET: {{ $appSecret | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  OIDC_PERSONA_CLIENT_SECRET: {{ .Values.secrets.oidcPersonaClientSecret | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  {{- end }}
{{- end }}
