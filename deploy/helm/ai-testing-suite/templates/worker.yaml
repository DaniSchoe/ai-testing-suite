apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suite.fullname" . }}-worker
  labels: {{- include "suite.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "suite.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels: {{- include "suite.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Laufende Tests bekommen Zeit, sauber abzuschließen.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ include "suite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "src/worker.js"]
          env:
            {{- include "suite.env" . | nindent 12 }}
            - name: MIGRATE_ON_START
              value: {{ (not .Values.migrations.enabled) | quote }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
