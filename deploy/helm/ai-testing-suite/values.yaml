image:
  repository: ghcr.io/danischoe/ai-testing-suite
  tag: ""            # Standard: appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Öffentliche URL (Ingress). Wird für OIDC-Redirects und Cookies benötigt.
publicUrl: https://ai-testing.example.com

web:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

# Worker führen die Tests aus (auch Lasttests, direkt im Pod). Für Lasttests großzügig
# dimensionieren oder mehr Replicas. embedded: true = kein eigenes Deployment, die Web-Pods
# führen die Tests selbst aus (ein einziges Deployment).
worker:
  embedded: false
  replicas: 1
  concurrency: 2       # parallele Testläufe pro Worker-Pod
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { memory: 1Gi }

oidc:
  issuerUrl: https://keycloak.example.com/realms/ai-testing
  clientId: ai-testing-suite
  # Issuer aus Keycloaks Discovery-Antwort übernehmen, auch wenn er von issuerUrl abweicht.
  # Nur als Notlösung, besser Keycloak (KC_HOSTNAME, KC_PROXY_HEADERS) oder issuerUrl korrigieren.
  trustDiscoveredIssuer: false

# Rollen, Berechtigungen und Teams werden in der Anwendung vergeben (Admin > Rollen/Benutzer/Teams).
# Diese Keycloak-E-Mails haben immer Admin-Zugriff (nur mit in Keycloak bestätigter E-Mail).
adminEmails: []
#  - admin@example.com

# Secrets: entweder hier setzen (Chart legt ein Secret an) oder existingSecret mit den Keys
# DATABASE_URL, APP_SECRET, OIDC_CLIENT_SECRET (und bei
# postgresql.enabled zusätzlich POSTGRES_PASSWORD) angeben.
secrets:
  existingSecret: ""
  databaseUrl: ""            # nur für externe Postgres (postgresql.enabled=false)
  appSecret: ""              # leer = wird einmalig zufällig erzeugt und bei Upgrades beibehalten
  oidcClientSecret: ""

# Postgres im Cluster (StatefulSet + PVC). Für eine externe/verwaltete Datenbank
# enabled: false setzen und secrets.databaseUrl angeben.
postgresql:
  enabled: true
  image: postgres:16-alpine
  database: suite
  username: suite
  password: ""               # leer = wird einmalig zufällig erzeugt und bei Upgrades beibehalten
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  persistence:
    enabled: true            # false = emptyDir, Daten gehen beim Pod-Neustart verloren
    existingClaim: ""        # vorhandenes PVC verwenden statt eines neuen
    size: 10Gi
    storageClassName: ""     # leer = Standard-StorageClass des Clusters
    accessModes: [ReadWriteOnce]
    keepOnUninstall: true    # PVC bei helm uninstall behalten
    annotations: {}

ingress:
  enabled: true
  className: nginx
  host: ai-testing.example.com
  # z. B. cert-manager.io/cluster-issuer: letsencrypt oder längere Timeouts für Lasttests:
  # nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  annotations: {}
  tls:
    enabled: true
    secretName: ai-testing-tls

service:
  port: 80

# Läuft als Helm-Hook vor Installation/Upgrade.
migrations:
  enabled: true

# Angezeigte Version oben rechts in der Oberfläche; leer = appVersion aus Chart.yaml.
appVersion: ""
logLevel: info
# Impressum, Support und Copyright auf der Info-Seite. Leere Angaben werden ausgeblendet.
info:
  copyright: ""              # Name im Copyright-Hinweis (Standard: ORCA)
  imprint:
    company: ""
    address: ""
    email: ""
    phone: ""
    register: ""
    representedBy: ""
  support:
    email: ""
    phone: ""
    url: ""
    hours: ""
# Favicon und Firmenlogo austauschen: ConfigMap mit den Dateien favicon.png und company-logo.png
# (kubectl create configmap branding --from-file=favicon.png --from-file=company-logo.png).
branding:
  existingConfigMap: ""
extraEnv: []
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
nodeSelector: {}
tolerations: []
affinity: {}
